name: CI

# The fast job keeps the ordinary CMake path and recording-stub seams cheap.
# The full job adds the expensive checks that need a genuine IMAS-Core build.
# Both install the shim and consume only its installed package artifacts.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both pinned to the ITER cluster modules, so CI guards the exact versions
  # this project deploys against rather than whatever is newest.
  RUST_VERSION: 1.88.0
  CARGO_C_VERSION: 0.10.15
  CARGO_LLVM_COV_VERSION: 0.9.1
  CARGO_TERM_COLOR: always

jobs:
  # This job proves the pinned graph can be provisioned and fully acquired at
  # the Rust acquisition interface, including reconstruction and resolution.
  graph-provisioning:
    name: Pinned DD graph provisioning smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dd-graph

      - uses: ./.github/actions/setup-toolchain

      - name: Acquire the complete live reference scopes
        run: bash tests/scripts/check-live-acquisition.sh

      - name: Record provisioning scope
        run: echo 'DD graph provisioning smoke check passed'

  # The normal production artifact consumes the pinned service. Fast retains
  # service-independent XML and controlled-graph fixture scenarios.
  graph-abi:
    name: Pinned DD graph C ABI matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAS_MVDD_GRAPH_DEADLINE_SECONDS: 120

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dd-graph

      - uses: ./.github/actions/setup-toolchain

      - name: Acquire the complete live equilibrium scope
        run: bash tests/scripts/check-live-acquisition.sh

      - name: Configure graph ABI recording-stub profile
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_GRAPH_TEST_SOURCE=live \
            -DIMAS_MVDD_REAL_CORE_TESTS=OFF

      - name: Build production C ABI test instance
        run: cmake --build build

      - name: Test production C ABI matrix
        run: ctest --test-dir build -L live-graph --output-on-failure --no-tests=error

  rust-line-coverage:
    # This is separate from the Debug/Release CMake matrix: it measures Rust
    # decisions once, while those jobs retain ABI and packaging coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Install the pinned coverage tool
        run: |
          rustup component add llvm-tools-preview --toolchain "$RUST_VERSION"
          cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      - name: Enforce scoped Rust line coverage
        run: bash scripts/audit-rust-line-coverage.sh
      # A failed threshold is exactly when the report is useful.
      - name: Upload scoped line-coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-line-coverage-lcov
          path: target/rust-line-coverage.lcov
          if-no-files-found: warn

  fast:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Debug and Release select different cargo profiles; exercise both
        # without making either wait for the real IMAS-Core build.
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features xml-fixture-source -- -D warnings

      - name: Configure recording-stub profile
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DIMAS_MVDD_REAL_CORE_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Test recording-stub seams
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install
        run: cmake --install build --prefix "$PWD/dist"

      - name: Check the installed package is consumable
        run: |
          set -euo pipefail
          core=$(find "$PWD/build" -maxdepth 2 -type f -name 'libal.so*' | head -1)
          test -n "$core"
          bash tests/scripts/check-installed-package.sh build dist "$core"

      - name: Check a staged (DESTDIR) install
        run: bash tests/scripts/check-staged-install.sh build

      - name: Check an install under a relative prefix
        run: bash tests/scripts/check-relative-prefix-install.sh build

  full:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Complete cold map acquisition needs the same budget as graph-abi.
      IMAS_MVDD_GRAPH_DEADLINE_SECONDS: 120

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      # Issue #228's real-Core coexistence scenarios exercise the production
      # ABI. Provision the pinned graph in this job too, so their
      # registration and execution cannot silently drift away from the graph
      # contract that supplies their complete scope.
      - name: Provision pinned DD graph for real-Core coexistence coverage
        uses: ./.github/actions/setup-dd-graph

      - name: Resolve IMAS-Core reference
        id: imas_core_ref
        run: |
          set -euo pipefail
          # First line only; commentary below the pin never changes the cache.
          # The shape rule is the one CMakeLists.txt and hli-validation.yml
          # apply: neither entry point may accept a pin the others reject.
          ref=$(head -n1 "$GITHUB_WORKSPACE/IMAS_CORE_REF" | tr -d '[:space:]')
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            echo "IMAS_CORE_REF must hold a full 40-character lowercase" \
                 "hexadecimal commit SHA on its first line; found '$ref'." >&2
            exit 1
          fi
          echo "commit=$ref" >> "$GITHUB_OUTPUT"

      - name: Install IMAS-Core build dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-filesystem-dev libhdf5-dev

      # Rebuild trees configured before the fork acquired upstream version tags.
      - name: Cache acquired IMAS-Core
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: al-core-${{ runner.os }}-Release-${{ steps.imas_core_ref.outputs.commit }}-tags-v1

      - name: Configure with real IMAS-Core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_GRAPH_TEST_SOURCE=live \
            -DIMAS_CORE_DOWNLOAD_DEPENDENCIES=ON

      - name: Verify acquired IMAS-Core revision
        run: |
          set -euo pipefail
          expected="${{ steps.imas_core_ref.outputs.commit }}"
          actual=$(git -C build/_deps/al-core-src rev-parse HEAD)
          expected=${expected,,}
          if [[ "$actual" != "$expected" ]]; then
            echo "acquired IMAS-Core commit $actual does not match pinned commit $expected" >&2
            exit 1
          fi

      - name: Build
        run: cmake --build build

      - name: Test graph coexistence real-Core scenarios
        run: |
          set -euo pipefail
          required=(
            live-graph-core-coexistence-forward
            live-graph-core-coexistence-reverse
            live-graph-core-coexistence-nested
          )
          pattern="^($(IFS='|'; echo "${required[*]}"))$"
          ctest --test-dir build --show-only=json-v1 > build/live-coexistence-inventory.json
          required_tests=$(IFS=';'; echo "${required[*]}")
          cmake \
            "-DINVENTORY_FILE=$PWD/build/live-coexistence-inventory.json" \
            "-DSELECTION_REGEX=$pattern" \
            "-DREQUIRED_TESTS=$required_tests" \
            -P tests/cmake/check_ctest_inventory.cmake
          ctest --test-dir build -R "$pattern" --output-on-failure --no-tests=error

      - name: Test drift and real-Core seams
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # The download above proves IMAS_CORE_DOWNLOAD_DEPENDENCIES; this
      # proves the default installed-package lookup against the Core just
      # built. EXCLUDE_FROM_ALL requires imas_print_version explicitly.
      - name: Install the acquired IMAS-Core
        run: |
          cmake --build build --target imas_print_version
          cmake --install build/_deps/al-core-build --prefix "$PWD/al-core-dist"

      # The production profile above must never inherit the controlled graph
      # facts. Keep the five deterministic coexistence regressions in their
      # own build, linked to the same pinned Core but to the private controlled
      # graph fixture rather than the installed production shim.
      - name: Configure controlled graph coexistence profile
        run: |
          cmake -S . -B build-controlled -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_GRAPH_TEST_SOURCE=controlled \
            -DCMAKE_PREFIX_PATH="$PWD/al-core-dist"

      - name: Build controlled graph coexistence profile
        run: cmake --build build-controlled --target graph_coexistence_oracle_test

      - name: Test controlled graph coexistence real-Core scenarios
        run: |
          set -euo pipefail
          required=(
            read-coexistence-forward-selects-primary-then-falls-back
            read-coexistence-forward-arraystruct-falls-back-between-j-candidates
            read-coexistence-reverse-selects-the-4.1-successor
            write-delete-coexistence-forward-is-primary-only-and-fans-out
            write-coexistence-reverse-non-primary-refuses
          )
          pattern="^($(IFS='|'; echo "${required[*]}"))$"
          ctest --test-dir build-controlled --show-only=json-v1 > \
            build-controlled/controlled-coexistence-inventory.json
          required_tests=$(IFS=';'; echo "${required[*]}")
          cmake \
            "-DINVENTORY_FILE=$PWD/build-controlled/controlled-coexistence-inventory.json" \
            "-DSELECTION_REGEX=$pattern" \
            "-DREQUIRED_TESTS=$required_tests" \
            -P tests/cmake/check_ctest_inventory.cmake
          ctest --test-dir build-controlled -R "$pattern" \
            --output-on-failure --no-tests=error

      - name: Configure, build and test installed IMAS-Core lookup
        run: |
          cmake -S . -B build-installed-mode -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_GRAPH_TEST_SOURCE=live \
            -DCMAKE_PREFIX_PATH="$PWD/al-core-dist"
          cmake --build build-installed-mode
          ctest --test-dir build-installed-mode --output-on-failure --no-tests=error

      - name: Install
        run: cmake --install build --prefix "$PWD/dist"

      - name: Check the installed package is consumable
        run: |
          set -euo pipefail
          core=$(find "$PWD/build/_deps/al-core-build" -type f -name 'libal.so*' | head -1)
          test -n "$core"
          bash tests/scripts/check-installed-package.sh build dist "$core"

      - name: Check a staged (DESTDIR) install
        run: bash tests/scripts/check-staged-install.sh build

      - name: Check an install under a relative prefix
        run: bash tests/scripts/check-relative-prefix-install.sh build
