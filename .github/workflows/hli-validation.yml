name: HLI validation

# Builds real HLIs against the installed shim and runs their own suites.
#
# ci.yml proves the shim's C ABI against a recording stub and against genuine
# IMAS-Core. Neither of those is a client: both call the ABI directly, with
# arguments a test author chose. These jobs put the Fortran and C++ HLIs in
# front of the shim, with calls and assertions from their own test suites.
#
# It is a separate workflow rather than a job in ci.yml for one mechanical
# reason: GitHub Actions has no job-level paths filter, so a paths-filtered job
# has to be a paths-filtered workflow.
#
# The HLIs, IMAS-Core and Data Dictionary are pinned so failures can be
# investigated against fixed sources. MDSplus packages come from its stable
# repository and their versions are recorded. The DD is pinned because the
# shim ships one conversion-map artifact.

on:
  pull_request:
    branches: [develop, main]
    # An ignore-list, not an allow-list, so the filter fails safe. A second
    # conversion-map artifact (docs/4.1.1--4.2.0.xml, once a generator exists)
    # is picked up without anyone remembering to add it; an allow-list would
    # silently stop running this job exactly when conversion changed.
    paths-ignore:
      - '**.md'
      - 'docs/adr/**'
      - 'graphify-out/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Its own group: a 40-minute job must not be cancelled by, or cancel, ci.yml.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.88.0
  CARGO_C_VERSION: 0.10.15
  CARGO_TERM_COLOR: always

  # Pinned, and the pin moves only when a new conversion-map artifact justifies
  # it. src/known_artifacts.rs embeds one artifact, for equilibrium
  # 3.39.0 <-> 4.1.1, and the HLI's committed fixtures are pulses written under
  # exactly those two versions. Under a different DD version the cross-version
  # test does not weaken, it stops meaning anything: no artifact serves the
  # pair, so nothing registers and nothing converts.
  HLI_DD_VERSION: 4.1.1

  # What the HLI suite is expected to register. These are assertions, not
  # documentation: without them a fork change that silently stops registering
  # the 83-IDS sweep still reports green.
  #
  # HLI_DISABLED_TESTS is the load-bearing one. Those tests are gated on
  # (NOT AL_BACKEND_MDSPLUS OR NOT AL_BACKEND_HDF5) -- both backends, not
  # either -- and the HLI's common/cmake/ALCore.cmake raises FATAL_ERROR if
  # MDSplus is requested alongside the shim, because the tests need an
  # al-mdsplus-model target only a non-shim build creates. So they can never run
  # here, and the number is a standing statement about a gap in this job's
  # coverage rather than an incidental total.
  #
  # CALIBRATION: these were first guessed from a macOS Debug build, then
  # corrected against what this job actually registers on Linux. They are no
  # longer a guess, so a mismatch is now a report about the pinned HLI rather
  # than about the calibration -- read it that way before editing these.
  #
  # ea28cc1 adds the put-policy test and expands tests/shim from the linkage
  # check to 30 registered tests (including fixture setup): 114 + 1 + 29.
  # The 20 disabled backend-dependent examples are unchanged.
  # Four need fixture tooling: provenance (imas-python + h5diff), and the
  # absent/malformed/unsupported-version stamps (h5py). Without it Linux
  # registers only 140 tests; install it before configuring the HLI below.
  HLI_TOTAL_TESTS: 144
  HLI_DISABLED_TESTS: 20

jobs:
  fortran-hli:
    # Pinned rather than ubuntu-latest, unlike ci.yml. The test counts above are
    # sensitive to what registers, and a runner image bump can move that; the
    # HLI's own CI is also proven on 24.04.
    name: IMAS-Fortran through the shim
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the shim
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      # This is a required graph-input gate for the separate installed HLI
      # conversion scenario below. The private package still selects its
      # controlled complete facts until #233 switches production selection, but
      # a setup or live-acquisition regression must not be hidden by that
      # controlled source.
      - uses: ./.github/actions/setup-dd-graph

      # Boost and HDF5 are IMAS-Core's dependencies, not the HLI's -- the HLI
      # looks for neither and links only the `al` target. These are the same apt
      # packages ci.yml's full job already builds IMAS-Core 5.7.1 against, and
      # that job reads the same fixture family through IMAS-Core's HDF5 backend
      # (tests/real_core/real_core_forwarding_test.c), so apt HDF5 is proven
      # against this data rather than assumed. The fixtures are superblock
      # version 2, which dates from HDF5 1.8, so 24.04's 1.10 reads them.
      - name: Install IMAS-Core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-filesystem-dev libhdf5-dev hdf5-tools gfortran-14 g++-14 gcc-14

      # CMake builds its own venv and installs saxonche into it
      # (common/cmake/ALBuildDataDictionary.cmake); all this needs to supply is
      # an interpreter with the venv module.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve the pinned HLI commit
        id: hli_pin
        run: |
          set -euo pipefail
          # First line only, the way CMakeLists.txt reads IMAS_CORE_VERSION with
          # LIMIT_COUNT 1. Everything below it in the file is commentary.
          ref=$(head -n1 IMAS_FORTRAN_REF | tr -d '[:space:]')
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            echo "IMAS_FORTRAN_REF must hold a full 40-character commit SHA on" \
                 "its first line; found '$ref'." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned IMAS-Fortran HLI
        uses: actions/checkout@v4
        with:
          # Upstream IMAS-Fortran carries no AL_USE_MULTIVERSION_SHIM option, so
          # the fork is not a convenience. The repository name lives here rather
          # than in IMAS_FORTRAN_REF because it is not the part that moves.
          repository: yohannmarguier/IMAS-Fortran
          ref: ${{ steps.hli_pin.outputs.ref }}
          path: hli

      - name: Install HLI fixture tooling
        run: |
          set -euo pipefail
          python -m venv hli/imas-python-fixtures/.venv
          hli/imas-python-fixtures/.venv/bin/python -m pip install -r .github/hli-fixture-requirements.txt
          hli/imas-python-fixtures/.venv/bin/python -c "import imas, h5py"
          command -v h5diff

      - name: Resolve the pinned IMAS-Core commit
        id: imas_core_pin
        run: |
          set -euo pipefail
          # First line only; commentary below the pin never changes the cache.
          ref=$(head -n1 IMAS_CORE_REF | tr -d '[:space:]')
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            echo "IMAS_CORE_REF must hold a full 40-character lowercase" \
                 "hexadecimal commit SHA on its first line; found '$ref'." >&2
            exit 1
          fi
          echo "commit=$ref" >> "$GITHUB_OUTPUT"

      # Exact key, no restore-keys. A miss must produce a clean full build
      # rather than a tree half-built against different sources, which is the
      # one failure mode here that is genuinely hard to read.
      #
      # Keyed on the resolved commit rather than hashFiles('IMAS_FORTRAN_REF'),
      # so editing that file's commentary does not throw the cache away. The
      # IMAS-Core's resolved pin is in the key, so commentary-only edits to the
      # pin file retain a warm tree while a moved commit rebuilds it.
      #
      # Restore and save are split so that a failing *test* run keeps the warm
      # tree. That is the common case for a regression gate: ctest goes red, a
      # fix is pushed, and the next run should not pay 40 minutes again.
      # Discard trees whose Core was configured without upstream version tags.
      - name: Restore the HLI build tree
        id: hli_cache
        uses: actions/cache/restore@v4
        with:
          path: hli/build
          key: hli-${{ runner.os }}-dd${{ env.HLI_DD_VERSION }}-fortran${{ steps.hli_pin.outputs.ref }}-core${{ steps.imas_core_pin.outputs.commit }}-tags-v1

      # IMAS_MVDD_REAL_CORE_TESTS=OFF because this job needs the shim built and
      # installed, not the shim's own suite -- ci.yml's fast and full jobs own
      # that. The option also feeds IMAS_CORE_BUILD_RPATH into build.rs, but the
      # install rule unsets it and relinks (CMakeLists.txt), so the *installed*
      # package is identical either way. Installing, rather than pointing the
      # HLI at a build tree, is deliberate: find_package(imas-mvdd-loader CONFIG)
      # is how a downstream consumer reaches the shim, so that is what gets
      # tested.
      - name: Build and install the shim
        run: |
          set -euo pipefail
          cmake -S . -B build-shim \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_REAL_CORE_TESTS=OFF
          cmake --build build-shim
          cmake --install build-shim --prefix "$PWD/dist"

      # This uses the installed-package shape without changing the ordinary
      # installation above: graph-package is a build-tree-only prefix whose
      # library has Cargo's internal graph-test-source feature enabled.
      - name: Package the graph-selected shim for the Fortran scenario
        run: cmake --build build-shim --target imas_mvdd_graph_test_package -j"$(nproc)"

      # The HLI acquires its run-time IMAS-Core here. Its repository and version
      # options are explicit so this build opens the same fork commit as ci.yml.
      #
      # AL_EXAMPLES stays ON even though 20 of its tests can never run in a shim
      # build, because HLI_DISABLED_TESTS asserts on that count.
      - name: Configure the HLI against the shim
        working-directory: hli
        run: |
          set -euo pipefail
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_Fortran_COMPILER=gfortran-14 \
            -DCMAKE_CXX_STANDARD=17 \
            -DAL_USE_MULTIVERSION_SHIM=ON \
            -DAL_CORE_GIT_REPOSITORY=https://github.com/yohannmarguier/IMAS-Core.git \
            -DAL_CORE_VERSION="${{ steps.imas_core_pin.outputs.commit }}" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dist" \
            -DDD_VERSION="${HLI_DD_VERSION}" \
            -DAL_BACKEND_HDF5=ON \
            -DAL_BACKEND_MDSPLUS=OFF \
            -DAL_BACKEND_UDA=OFF \
            -DAL_BUILD_MDSPLUS_MODELS=OFF \
            -DAL_TESTS=ON \
            -DAL_EXAMPLES=ON \
            -DAL_PLAYGROUND=ON \
            -DAL_PLUGINS=OFF \
            -DAL_HLI_DOCS=OFF

      # The HLI reaches its run-time IMAS-Core through ExternalProject, not
      # FetchContent, so the clone happens at *build* time and lands under that
      # project's own prefix -- neither the moment nor the directory ci.yml
      # checks. Building the one target first puts the assertion ahead of the
      # HLI build rather than after it, so a wrong library is reported before
      # the suite is compiled against it.
      - name: Build the pinned IMAS-Core
        working-directory: hli
        run: cmake --build build --target al-core-runtime -j"$(nproc)"

      - name: Verify acquired IMAS-Core revision
        working-directory: hli
        run: |
          set -euo pipefail
          expected="${{ steps.imas_core_pin.outputs.commit }}"
          source_dir=build/_deps/al-core-runtime/src/al-core-runtime
          actual=$(git -C "$source_dir" rev-parse HEAD)
          expected=${expected,,}
          if [[ "$actual" != "$expected" ]]; then
            echo "acquired IMAS-Core commit $actual does not match pinned commit $expected" >&2
            exit 1
          fi

      - name: Build the HLI
        id: build_hli
        working-directory: hli
        run: cmake --build build -j"$(nproc)"

      # Asserted before ctest runs, so a suite that shrank is reported as a
      # shrunken suite rather than as a pass.
      - name: Check the registered test counts
        working-directory: hli/build
        run: |
          set -euo pipefail
          listing=$(ctest -N)
          printf '%s\n' "$listing"
          total=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p')
          disabled=$(printf '%s\n' "$listing" | grep -c '(Disabled)' || true)
          enabled=$(( total - disabled ))
          expected_enabled=$(( HLI_TOTAL_TESTS - HLI_DISABLED_TESTS ))

          echo "registered=$total enabled=$enabled disabled=$disabled"

          for required in \
            al-fortran-test-shim-fixture-provenance \
            al-fortran-test-shim-stamp-absent \
            al-fortran-test-shim-stamp-malformed \
            al-fortran-test-shim-stamp-mismatch-no-artifact; do
            if ! printf '%s\n' "$listing" | grep -qE ": ${required}$"; then
              echo "Missing required HLI fixture test: $required" >&2
              exit 1
            fi
          done

          if [ "$total" != "$HLI_TOTAL_TESTS" ] || \
             [ "$disabled" != "$HLI_DISABLED_TESTS" ]; then
            {
              echo "The HLI suite did not register what this workflow expects."
              echo "  registered: $total (expected $HLI_TOTAL_TESTS)"
              echo "  enabled:    $enabled (expected $expected_enabled)"
              echo "  disabled:   $disabled (expected $HLI_DISABLED_TESTS)"
              echo
              echo "If IMAS_FORTRAN_REF was just moved, the pinned HLI"
              echo "changed what it registers and this is the deliberate"
              echo "recalibration: confirm the difference against that pin's"
              echo "diff, then set HLI_TOTAL_TESTS and HLI_DISABLED_TESTS to"
              echo "the values above and say in the comment which commit"
              echo "accounts for them."
              echo
              echo "If the pin did not move, something stopped registering."
              echo "A drop in the enabled count means the per-IDS sweep or"
              echo "the playground conversion tests are gone, and this job is"
              echo "no longer proving what it claims."
            } >&2
            exit 1
          fi

      # USER is overridden to a directory because IMAS-Core's legacy pulse paths
      # interpolate it; the HLI's own CI does the same. ctest is given
      # IMAS_CORE_LIBRARY per test by ALCore.cmake, so nothing else is needed
      # here for the shim to find the IMAS-Core it opens.
      - name: Run the HLI suite through the shim
        working-directory: hli/build
        run: |
          set -euo pipefail
          mkdir -p "$PWD/testdb"
          export USER="$PWD/testdb"
          ctest --output-on-failure --no-tests=error

      # Keep the graph-selected scenario in a separate HLI build. The normal
      # build above must keep consuming the ordinary installed XML-selected
      # package and retain its complete passthrough suite and count assertion.
      - name: Configure the graph-backed Fortran conversion scenario
        working-directory: hli
        run: |
          set -euo pipefail
          cmake -B build-graph \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_Fortran_COMPILER=gfortran-14 \
            -DCMAKE_CXX_STANDARD=17 \
            -DAL_USE_MULTIVERSION_SHIM=ON \
            -DAL_SHIM_GRAPH_RUNTIME_SCENARIO=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-shim/graph-package" \
            -DAL_CORE_GIT_REPOSITORY=https://github.com/yohannmarguier/IMAS-Core.git \
            -DAL_CORE_VERSION="${{ steps.imas_core_pin.outputs.commit }}" \
            -DDD_VERSION="${HLI_DD_VERSION}" \
            -DAL_BACKEND_HDF5=ON \
            -DAL_BACKEND_MDSPLUS=OFF \
            -DAL_BACKEND_UDA=OFF \
            -DAL_BUILD_MDSPLUS_MODELS=OFF \
            -DAL_TESTS=ON \
            -DAL_EXAMPLES=OFF \
            -DAL_PLAYGROUND=OFF \
            -DAL_PLUGINS=OFF \
            -DAL_HLI_DOCS=OFF

      - name: Build the graph-backed Fortran conversion scenario
        working-directory: hli
        run: |
          set -euo pipefail
          cmake --build build-graph --target al-fortran-test-shim-graph-runtime -j"$(nproc)"
          cmake --build build-graph --target al-core-runtime -j"$(nproc)"
          expected="${{ steps.imas_core_pin.outputs.commit }}"
          actual=$(git -C build-graph/_deps/al-core-runtime/src/al-core-runtime rev-parse HEAD)
          expected=${expected,,}
          test "$actual" = "$expected"

      - name: Run the graph-backed Fortran conversion scenario
        working-directory: hli
        run: |
          set -euo pipefail
          mkdir -p "$PWD/build-graph/testdb"
          export USER="$PWD/build-graph/testdb"
          listing=$(ctest --test-dir build-graph -N -R '^al-fortran-test-shim-graph-runtime$')
          printf '%s\n' "$listing"
          graph_scenario_count=$(printf '%s\n' "$listing" | grep -cE '^  Test #[0-9]+:' || true)
          test "$graph_scenario_count" -gt 0
          ctest --test-dir build-graph -R '^al-fortran-test-shim-graph-runtime$' \
            --output-on-failure --no-tests=error
          graph_release=$(sed -n 's/^GRAPH_RELEASE=//p' "$GITHUB_WORKSPACE/config/dd-graph-release.env")
          graph_manifest=$(sed -n 's/^GRAPH_MANIFEST_DIGEST=//p' "$GITHUB_WORKSPACE/config/dd-graph-release.env")
          {
            echo "### Graph-selected Fortran conversion"
            echo
            echo "| Input | Pinned identity |"
            echo "|---|---|"
            echo "| IMAS-Fortran | \`${{ steps.hli_pin.outputs.ref }}\` |"
            echo "| IMAS-Core | \`${{ steps.imas_core_pin.outputs.commit }}\` |"
            echo "| DD graph release | \`$graph_release\` |"
            echo "| DD graph manifest | \`$graph_manifest\` |"
            echo "| Selected HLI scenarios | \`$graph_scenario_count\` |"
            echo
            echo "The pinned graph was started by the shared setup action. This"
            echo "HLI scenario uses the private graph-selected test package; it"
            echo "does not select a graph source in the shipped installation."
          } >> "$GITHUB_STEP_SUMMARY"

      # The drift verdict only reaches stderr (VersionDrift::record in
      # src/core/core_binding.rs), and --output-on-failure hides it on a passing
      # run. One verbose single test is enough to harvest it.
      - name: Report which IMAS-Core this ran against
        if: always() && steps.build_hli.outcome == 'success'
        working-directory: hli/build
        run: |
          set -uo pipefail
          mkdir -p "$PWD/testdb"
          export USER="$PWD/testdb"
          probe=$(ctest -R '^example-fortran-test_version$' -V 2>&1 || true)
          drift=$(printf '%s\n' "$probe" | grep 'imas-mvdd-loader:' || true)
          if [ -z "$drift" ]; then
            drift="(no verdict harvested from the probe)"
          fi
          {
            echo "### IMAS-Core this run opened"
            echo
            echo "This run pins IMAS-Core alongside the HLI and Data Dictionary."
            echo "The pinned commit identifies as a development version, so the"
            echo "shim records version drift as the expected steady state. Its"
            echo "compatibility gate still refuses a different major version."
            echo
            echo "Drift is reported here, never asserted: this step is a report"
            echo "and cannot fail the job. An empty verdict below means the"
            echo "probe harvested nothing, not that the shim agreed on a version."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Repository | \`https://github.com/yohannmarguier/IMAS-Core.git\` |"
            echo "| Pinned commit | \`${{ steps.imas_core_pin.outputs.commit }}\` |"
            echo "| Shim built against | \`$(head -n1 "$GITHUB_WORKSPACE/IMAS_CORE_VERSION")\` |"
            echo
            echo "Drift verdict (expected steady state):"
            echo
            echo '```'
            printf '%s\n' "$drift"
            echo '```'
            echo
            echo "A \`major version mismatch\` means the pin crossed the shim's"
            echo "supported major-version boundary."
          } >> "$GITHUB_STEP_SUMMARY"

      # Gated on the build rather than on the job, so a red suite keeps the warm
      # tree for the next attempt. A failed *build* saves nothing, because a
      # half-built tree is what the exact-key policy above exists to avoid.
      - name: Save the HLI build tree
        if: always() && steps.build_hli.outcome == 'success' && steps.hli_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hli/build
          key: ${{ steps.hli_cache.outputs.cache-primary-key }}

  cpp-hli:
    name: Imas-Cpp through the shim
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MDSPLUS_DIR: /usr/local/mdsplus
      LD_LIBRARY_PATH: /usr/local/mdsplus/lib
      CLASSPATH: /usr/local/mdsplus/java/classes/jTraverser.jar
    steps:
      - name: Check out the shim
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve pinned sources
        id: pins
        run: |
          set -euo pipefail
          for component in CPP CORE; do
            ref=$(head -n1 "IMAS_${component}_REF" | tr -d '[:space:]')
            if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "IMAS_${component}_REF must start with a full commit SHA" >&2
              exit 1
            fi
            echo "${component,,}=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Check out pinned IMAS-Cpp
        uses: actions/checkout@v4
        with:
          repository: yohannmarguier/IMAS-Cpp
          ref: ${{ steps.pins.outputs.cpp }}
          fetch-depth: 0
          path: hli-cpp

      # The generated C++ suite only implements MDSplus. OFF would silently
      # disable cpp-TestSuite. Follow the Core fork's docker/mdsplus recipe:
      # runtime + headers/libraries, and Java's CompileTree for the DD models.
      - name: Install MDSplus and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          wget -qO- http://www.mdsplus.org/dist/mdsplus.gpg.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/mdsplus.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/mdsplus.gpg] http://www.mdsplus.org/dist/Ubuntu24/repo MDSplus stable' | \
            sudo tee /etc/apt/sources.list.d/mdsplus.list
          sudo apt-get update
          sudo apt-get install -y mdsplus mdsplus-devel mdsplus-java \
            openjdk-21-jdk-headless libboost-filesystem-dev libhdf5-dev \
            libblitz0-dev gcc-14 g++-14 python3-venv
          echo "$MDSPLUS_DIR/bin" >> "$GITHUB_PATH"
          dpkg-query -W 'mdsplus*' | tee mdsplus-packages.txt
          {
            echo '### C++ MDSplus dependencies'
            echo 'MDSplus is linked by IMAS-Core; the C++ HLI links the shim.'
            echo 'DD 4.1.1 models are built with Java CompileTree.'
            echo '```'
            cat mdsplus-packages.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # tests/shim registers its five stamp-state contract assertions
      # (F2.1-F2.4, F3.1) only when imas-python-fixtures/.venv can import
      # h5py: the three stamp fixtures they read are derived from the
      # checked-in DD 3.39.0 pulse at build time. Registration is decided at
      # configure time, so this has to run before it -- and without it the job
      # would run five of the thirteen contract assertions short and still
      # report success.
      #
      # h5py alone, not the fixtures' full requirements. Those pull in
      # imas-python, which would also register F1.4 fixture-provenance (it
      # additionally needs h5diff, not installed here): that test regenerates
      # the fixture pair and h5diffs it against the checked-in oracle, so it
      # would compare against whatever Data Dictionary pip resolved that
      # morning and could go red for a reason living in neither the shim nor
      # this HLI. It is a provenance check on the fixtures rather than a
      # statement about conversion, so it stays unregistered here. The count
      # asserted below pins that choice: if either prerequisite ever appears,
      # the inventory grows and the assertion reports it by name.
      - name: Provision the shim suite's fixture venv
        run: |
          set -euo pipefail
          python3 -m venv hli-cpp/imas-python-fixtures/.venv
          venv=hli-cpp/imas-python-fixtures/.venv/bin/python
          "$venv" -m pip install --quiet --upgrade pip
          "$venv" -m pip install --quiet h5py
          "$venv" -c 'import h5py; print("h5py", h5py.__version__)'

      - name: Build and install the shim
        run: |
          set -euo pipefail
          cmake -S . -B build-shim -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_REAL_CORE_TESTS=OFF
          cmake --build build-shim
          cmake --install build-shim --prefix "$PWD/dist"

      - name: Configure C++ against the shim and pinned Core
        run: |
          set -euo pipefail
          cmake -S hli-cpp -B hli-cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_PREFIX_PATH="$PWD/dist" \
            -DAL_USE_MULTIVERSION_SHIM=ON \
            -DAL_DOWNLOAD_DEPENDENCIES=ON \
            -DAL_CORE_GIT_REPOSITORY=https://github.com/yohannmarguier/IMAS-Core.git \
            -DAL_CORE_VERSION="${{ steps.pins.outputs.core }}" \
            -DDD_VERSION="$HLI_DD_VERSION" \
            -DAL_BACKEND_MDSPLUS=ON -DAL_BUILD_MDSPLUS_MODELS=ON \
            -DAL_BACKEND_HDF5=ON -DAL_BACKEND_UDA=OFF \
            -DAL_TESTS=ON -DAL_EXAMPLES=ON -DAL_PLUGINS=OFF \
            -DAL_BUILD_TESTS=OFF -DAL_PYTHON_BINDINGS=OFF -DAL_HLI_DOCS=OFF
          actual=$(git -C hli-cpp/build/_deps/al-core-src rev-parse HEAD)
          test "$actual" = "${{ steps.pins.outputs.core }}"

      - name: Build C++, Core and MDSplus models
        run: cmake --build hli-cpp/build --parallel 2

      - name: Verify the C++ test suite and linkage
        working-directory: hli-cpp/build
        run: |
          set -euo pipefail
          ctest --show-only=json-v1 > test-inventory.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          tests = json.loads(Path('test-inventory.json').read_text())['tests']
          names = {t['name'] for t in tests}
          # 38b9460 registers the generated suite, 21 non-plugin examples, the
          # two generator refusal-policy tests, and tests/shim's Tier-1 shim
          # conformance suite. That suite's own README observed 42 registered
          # on macOS with both its prerequisites present; this job installs
          # h5py but not h5diff, so F1.4 fixture-provenance is the one that
          # does not register here. 22 + 2 + 41.
          assert len(tests) == 65, (
              f'Expected 65 C++ tests, got {len(tests)}: {sorted(names)}')
          required = (
              'cpp-TestSuite',
              'example-cpp-test_version',
              # Registered unconditionally by tests/generator: a truth table
              # over the refusal-tolerance chokepoint and a check on the
              # generated write traversal. Neither opens a data entry.
              'cpp-test-refusal-policy',
              'cpp-test-generated-write-refusal-policy',
              # F1.1. Every other test in the suite passes just as well
              # against a build that resolved straight to Core, so this is
              # the one that makes the rest mean anything.
              'cpp-test-shim-linkage',
              # The thirteen contract assertions and the one behaviour-pin --
              # the catalogue in hli-cpp/tests/shim/README.md. Named rather
              # than counted so a renamed or dropped scenario is a failure
              # here and not a silently smaller suite.
              'cpp-test-shim-version-unset',
              'cpp-test-shim-stamp-equal',
              'cpp-test-shim-stamp-absent',
              'cpp-test-shim-stamp-mismatch-no-artifact',
              'cpp-test-shim-stamp-malformed',
              'cpp-test-shim-structural-rules',
              'cpp-test-shim-cocos-rules',
              'cpp-test-shim-right-only-rules',
              'cpp-test-shim-refusal-channels',
              'cpp-test-shim-nested-loss',
              'cpp-test-shim-roundtrip-cross-dd',
              'cpp-test-shim-roundtrip-same-dd',
              'cpp-test-shim-full-put-stamp',
              'cpp-test-shim-torn-write',
          )
          missing = [n for n in required if n not in names]
          assert not missing, f'missing: {missing} from {sorted(names)}'
          disabled = [t['name'] for t in tests for p in t['properties']
                      if p['name'] == 'DISABLED' and p['value']]
          assert not disabled, disabled
          # Two rules, because one no longer fits the whole inventory.
          #
          # The examples and the generated suite must each name the shim's
          # runtime Core and the DD version they were generated against --
          # that is what this step was written to prove, and it still holds
          # for every test outside tests/shim, bar the two generator policy
          # tests, which drive hand-made statuses and read generated source
          # without opening a data entry.
          #
          # tests/shim is deliberately mixed: its linkage, comparator and
          # fixture helpers inspect files, and its two round-trip contract
          # assertions read a result marker the pair runner wrote, so
          # requiring the environment of all of them would assert something
          # untrue. What keeps that suite honest is not this environment but
          # cpp-test-shim-linkage (F1.1) above, which fails unless the built
          # library actually depends on the shim.
          inspection_only = {
              'cpp-test-refusal-policy',
              'cpp-test-generated-write-refusal-policy',
          }
          checked = 0
          for test in tests:
              props = {p['name']: p['value'] for p in test['properties']}
              env = props.get('ENVIRONMENT', [])
              labels = props.get('LABELS', [])
              shim_suite = 'shim' in labels
              names_core = any(e.startswith('IMAS_CORE_LIBRARY=') for e in env)
              names_dd = 'IMAS_MVDD_HLI_DD_VERSION=4.1.1' in env
              # F2.1 is the one test that must NOT carry the HLI DD version.
              # The shim latches that version once per process, and absence --
              # not an empty value, not a late unset in a wrapper -- is what
              # the scenario asserts the shim does with. Asserted in the
              # opposite direction rather than skipped, so the day it silently
              # gains a version this still fails.
              if test['name'] == 'cpp-test-shim-version-unset':
                  assert names_core, test['name']
                  assert not names_dd, f"{test['name']} must not name a DD version"
                  checked += 1
                  continue
              if not shim_suite and test['name'] not in inspection_only:
                  assert names_core, test['name']
                  assert names_dd, test['name']
                  checked += 1
                  continue
              # A shim test that sets half the environment is a mistake the
              # test itself cannot report: it would load the shim and then
              # convert against the wrong HLI version, or fail to find Core.
              if names_core or names_dd:
                  assert names_core, test['name']
                  assert names_dd, test['name']
                  checked += 1
          print(f'{len(tests)} enabled C++ tests, {checked} configured for the shim')
          PYCODE
          readelf -d libal-cpp-4.1.1.so | tee cpp-linkage.txt
          grep -q 'Shared library: \[libimas_mvdd_loader' cpp-linkage.txt
          if grep -q 'Shared library: \[libal\.so' cpp-linkage.txt; then
            echo 'C++ links directly to Core and would bypass the shim' >&2
            exit 1
          fi
          for file in ids_model.tree ids_model.characteristics; do
            test -s "_deps/al-core-build/models/mdsplus/$file"
          done
          test -e _deps/al-core-build/models/mdsplus/ids_model.datafile

      # The examples share pulses, so keep CTest serial. Core interpolates
      # USER into legacy pulse paths; keep all test data inside this build.
      - name: Run the C++ HLI tests
        working-directory: hli-cpp/build
        run: |
          set -euo pipefail
          mkdir -p "$PWD/testdb"
          export USER="$PWD/testdb"
          ctest --output-on-failure --no-tests=error --parallel 1

      - name: Preserve C++ test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-hli-diagnostics
          path: |
            mdsplus-packages.txt
            hli-cpp/build/Testing/Temporary/
            hli-cpp/build/test-inventory.json
            hli-cpp/build/cpp-linkage.txt
            hli-cpp/build/CMakeCache.txt

  matlab-hli:
    name: IMAS-MATLAB through the shim
    runs-on: ubuntu-24.04
    # Longer than the other jobs because al-mex-test alone carries a CMake
    # TIMEOUT of 3600: it runs every IDS across two backends and both
    # homogeneous-time settings from a single MATLAB session.
    timeout-minutes: 150
    env:
      MDSPLUS_DIR: /usr/local/mdsplus
      LD_LIBRARY_PATH: /usr/local/mdsplus/lib
      CLASSPATH: /usr/local/mdsplus/java/classes/jTraverser.jar
    steps:
      - name: Check out the shim
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve pinned sources
        id: pins
        run: |
          set -euo pipefail
          for component in MATLAB CORE; do
            ref=$(head -n1 "IMAS_${component}_REF" | tr -d '[:space:]')
            if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "IMAS_${component}_REF must start with a full commit SHA" >&2
              exit 1
            fi
            echo "${component,,}=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Check out pinned IMAS-MATLAB
        uses: actions/checkout@v4
        with:
          repository: yohannmarguier/IMAS-MATLAB
          ref: ${{ steps.pins.outputs.matlab }}
          fetch-depth: 0
          path: hli-matlab

      # tests/imas_unit_tests.m parameterises its class setup over *both*
      # backends -- struct('MDSplus',12,'HDF5',13) -- unconditionally, and
      # seven of the eight examples are MDSplus-only. So this job cannot drop
      # MDSplus the way the MATLAB fork's own CI does without silently reducing
      # al-mex-test to half a suite and disabling most of the examples. Same
      # recipe as cpp-hli above: runtime + headers/libraries, and Java's
      # CompileTree for the DD models.
      - name: Install MDSplus and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          wget -qO- http://www.mdsplus.org/dist/mdsplus.gpg.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/mdsplus.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/mdsplus.gpg] http://www.mdsplus.org/dist/Ubuntu24/repo MDSplus stable' | \
            sudo tee /etc/apt/sources.list.d/mdsplus.list
          sudo apt-get update
          sudo apt-get install -y mdsplus mdsplus-devel mdsplus-java \
            openjdk-21-jdk-headless libboost-filesystem-dev libhdf5-dev \
            hdf5-tools gcc-14 g++-14
          echo "$MDSPLUS_DIR/bin" >> "$GITHUB_PATH"
          dpkg-query -W 'mdsplus*' | tee mdsplus-packages.txt

      # The forks are public and this runs on a GitHub-hosted runner, which is
      # what MathWorks' batch licensing requires; a private repository or a
      # self-hosted runner would need a MATLAB_BATCH_TOKEN secret instead.
      # R2023b is the release the MATLAB fork's own CI is proven on.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
          products: MATLAB

      # Matlab_ROOT_DIR is what find_package(Matlab) keys on, and CMake does
      # not derive it from PATH.
      #
      # Deliberately does NOT run `matlab -batch`: setup-matlab installs MATLAB
      # but does not license it. On a public project only the Run MATLAB
      # Command / Tests / Build actions license MATLAB automatically, and they
      # license the one process they start. A direct `matlab -batch` fails with
      # "License checkout failed. License Manager Error -1". Compiling MEX
      # files needs the installation, not a licence, so the build below is
      # unaffected -- see the test step for what that costs.
      - name: Record the MATLAB installation
        run: |
          set -euo pipefail
          matlab_root=$(dirname "$(dirname "$(command -v matlab)")")
          test -x "$matlab_root/bin/matlab"
          echo "MATLAB_ROOT=$matlab_root" >> "$GITHUB_ENV"
          {
            echo '### MATLAB and MDSplus dependencies'
            echo "MATLAB root: \`$matlab_root\`"
            echo 'MDSplus is linked by IMAS-Core; the MEX layer links the shim.'
            echo '```'
            cat mdsplus-packages.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and install the shim
        run: |
          set -euo pipefail
          cmake -S . -B build-shim -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_REAL_CORE_TESTS=OFF
          cmake --build build-shim
          cmake --install build-shim --prefix "$PWD/dist"

      # AL_CREATE_TOOLBOX stays OFF: packaging the toolbox runs MATLAB again at
      # install time and proves nothing about conversion.
      - name: Configure MATLAB against the shim and pinned Core
        run: |
          set -euo pipefail
          cmake -S hli-matlab -B hli-matlab/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_PREFIX_PATH="$PWD/dist" \
            -DMatlab_ROOT_DIR="$MATLAB_ROOT" \
            -DAL_USE_MULTIVERSION_SHIM=ON \
            -DAL_DOWNLOAD_DEPENDENCIES=ON \
            -DAL_CORE_GIT_REPOSITORY=https://github.com/yohannmarguier/IMAS-Core.git \
            -DAL_CORE_VERSION="${{ steps.pins.outputs.core }}" \
            -DDD_VERSION="$HLI_DD_VERSION" \
            -DAL_BACKEND_MDSPLUS=ON -DAL_BUILD_MDSPLUS_MODELS=ON \
            -DAL_BACKEND_HDF5=ON -DAL_BACKEND_UDA=OFF \
            -DAL_TESTS=ON -DAL_EXAMPLES=ON -DAL_PLUGINS=OFF \
            -DAL_CREATE_TOOLBOX=OFF -DAL_HLI_DOCS=OFF
          actual=$(git -C hli-matlab/build/_deps/al-core-src rev-parse HEAD)
          test "$actual" = "${{ steps.pins.outputs.core }}"

      - name: Build MATLAB, Core and MDSplus models
        id: build_matlab
        run: cmake --build hli-matlab/build --parallel 2

      # The fork registers its own linkage tests (tests/shim/), so this step
      # asserts they exist and are wired rather than re-implementing readelf
      # the way cpp-hli has to. The two linkage tests are deliberately excluded
      # from the environment assertion: they inspect a file and never open a
      # data entry, so tests/CMakeLists.txt never gives them the shim variables.
      - name: Verify the MATLAB test suite and linkage
        working-directory: hli-matlab/build
        run: |
          set -euo pipefail
          ctest --show-only=json-v1 > test-inventory.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          tests = json.loads(Path('test-inventory.json').read_text())['tests']
          # a7905ab registers al-mex-test, al-utils-unit-test, two MEX
          # shim-linkage checks, and eight examples (seven MDSplus + one HDF5).
          # AL_PLUGINS=OFF, so there is no -with-plugins twin and no
          # al-partial-get-test.
          assert len(tests) == 12, f'Expected 12 MATLAB tests, got {len(tests)}'
          names = {t['name'] for t in tests}
          for required in ('al-mex-test',
                           'al-utils-unit-test',
                           'al-mex-shim-linkage',
                           'mex-imas_open-shim-linkage',
                           'example-mex-test_get',
                           'example-mex-test_put',
                           'example-mex-test_get_sample_magnetics'):
              assert required in names, (required, sorted(names))
          disabled = [t['name'] for t in tests for p in t['properties']
                      if p['name'] == 'DISABLED' and p['value']]
          assert not disabled, disabled
          linkage = {'al-mex-shim-linkage', 'mex-imas_open-shim-linkage'}
          for test in tests:
              if test['name'] in linkage:
                  continue
              props = {p['name']: p['value'] for p in test['properties']}
              env = props.get('ENVIRONMENT', [])
              assert any(e.startswith('IMAS_CORE_LIBRARY=') for e in env), test['name']
              assert 'IMAS_MVDD_HLI_DD_VERSION=4.1.1' in env, test['name']
          print(f'{len(tests)} enabled MATLAB tests, all configured for the shim')
          PYCODE
          for file in ids_model.tree ids_model.characteristics; do
            test -s "_deps/al-core-build/models/mdsplus/$file"
          done
          test -e _deps/al-core-build/models/mdsplus/ids_model.datafile

      # Only the two linkage tests run here, and that is a deliberate limit
      # rather than an oversight. Ten of the twelve registered tests launch
      # the MATLAB interpreter through ${Matlab_MAIN_PROGRAM}, and CTest starts
      # those processes itself. MathWorks licenses a public project's MATLAB
      # only through its own Run MATLAB Command / Tests / Build actions, each
      # of which licenses the single process it starts -- there is no
      # documented job-wide token that a CTest-spawned `matlab -batch` would
      # pick up. So this job proves what it can prove without a licence:
      # IMAS-MATLAB configures against the installed shim, every MEX target
      # compiles against it, and the two the fork inspects link
      # libimas_mvdd_loader rather than libal. What it does not prove is that
      # MATLAB code round-trips through the shim; the probe below exists to
      # find out whether that is reachable at all.
      #
      # The count is asserted rather than assumed: if the fork ever registers
      # a third licence-free test, this must be a decision, not a drift.
      - name: Run the licence-free MATLAB tests
        working-directory: hli-matlab/build
        run: |
          set -euo pipefail
          mkdir -p "$PWD/testdb"
          export USER="$PWD/testdb"
          ctest --output-on-failure --no-tests=error --parallel 1 -R 'shim-linkage$'
          ran=$(ctest -N -R 'shim-linkage$' | sed -n 's/^Total Tests: *//p')
          if [ "$ran" != "2" ]; then
            echo "Expected 2 licence-free MATLAB tests, found $ran" >&2
            exit 1
          fi

      # The remaining ten are NOT run, and that question is settled rather
      # than open. Run 34852296651 drove the nine that existed at the time
      # through matlab-actions/run-command -- the supported auto-licensed
      # entry point for a public project -- and all nine failed with
      # "Licensing error: -1,359": run-command licenses the one MATLAB it
      # starts, and that licence does not reach the `matlab -batch` processes
      # CTest starts underneath it. 0 of 9 passed. al-utils-unit-test, which
      # a7905ab added since, is a tenth `matlab -batch` test and inherits the
      # same limit unmeasured. The probe that established
      # this was removed once it had answered; re-add it only if MathWorks
      # documents a job-wide batch licence, since a permanently red step that
      # cannot fail the job is noise nobody reads.
      - name: Preserve MATLAB test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-hli-diagnostics
          path: |
            mdsplus-packages.txt
            hli-matlab/build/Testing/Temporary/
            hli-matlab/build/test-inventory.json

  java-hli:
    name: IMAS-Java through the shim
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MDSPLUS_DIR: /usr/local/mdsplus
      LD_LIBRARY_PATH: /usr/local/mdsplus/lib
      CLASSPATH: /usr/local/mdsplus/java/classes/jTraverser.jar
    steps:
      - name: Check out the shim
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve pinned sources
        id: pins
        run: |
          set -euo pipefail
          for component in JAVA CORE; do
            ref=$(head -n1 "IMAS_${component}_REF" | tr -d '[:space:]')
            if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "IMAS_${component}_REF must start with a full commit SHA" >&2
              exit 1
            fi
            echo "${component,,}=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Check out pinned IMAS-Java
        uses: actions/checkout@v4
        with:
          repository: yohannmarguier/IMAS-Java
          ref: ${{ steps.pins.outputs.java }}
          fetch-depth: 0
          path: hli-java

      # examples/CMakeLists.txt prefers MDSplus (IMAS_AL_DEFAULT_BACKEND=12)
      # and asks al-mdsplus-model for its model directory, which only exists
      # when the models are built. HDF5 is its declared fallback, but MDSplus
      # is what the Java fork's own ci/build_and_test.sh defaults to, so that
      # is the configuration this job proves. Same package recipe as cpp-hli.
      # The JDK is not optional here the way it is for C++: it builds the jars
      # and runs every test. It also has to be the *full* JDK. cpp-hli installs
      # openjdk-21-jdk-headless because it only needs Java for MDSplus
      # CompileTree, but this job calls find_package(JNI), which looks for the
      # AWT native libraries the headless package omits -- with headless, CMake
      # fails at configure time with "Could NOT find JNI (missing: AWT)".
      - name: Install MDSplus, the JDK and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          wget -qO- http://www.mdsplus.org/dist/mdsplus.gpg.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/mdsplus.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/mdsplus.gpg] http://www.mdsplus.org/dist/Ubuntu24/repo MDSplus stable' | \
            sudo tee /etc/apt/sources.list.d/mdsplus.list
          sudo apt-get update
          sudo apt-get install -y mdsplus mdsplus-devel mdsplus-java \
            openjdk-21-jdk libboost-filesystem-dev libhdf5-dev \
            hdf5-tools gcc-14 g++-14
          echo "$MDSPLUS_DIR/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          dpkg-query -W 'mdsplus*' | tee mdsplus-packages.txt
          {
            echo '### Java MDSplus dependencies'
            echo 'MDSplus is linked by IMAS-Core; the JNI binding links the shim.'
            echo 'DD 4.1.1 models are built with Java CompileTree.'
            echo '```'
            cat mdsplus-packages.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and install the shim
        run: |
          set -euo pipefail
          cmake -S . -B build-shim -DCMAKE_BUILD_TYPE=Release \
            -DIMAS_MVDD_REAL_CORE_TESTS=OFF
          cmake --build build-shim
          cmake --install build-shim --prefix "$PWD/dist"

      - name: Configure Java against the shim and pinned Core
        run: |
          set -euo pipefail
          cmake -S hli-java -B hli-java/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_PREFIX_PATH="$PWD/dist" \
            -DAL_USE_MULTIVERSION_SHIM=ON \
            -DAL_DOWNLOAD_DEPENDENCIES=ON \
            -DAL_CORE_GIT_REPOSITORY=https://github.com/yohannmarguier/IMAS-Core.git \
            -DAL_CORE_VERSION="${{ steps.pins.outputs.core }}" \
            -DDD_VERSION="$HLI_DD_VERSION" \
            -DAL_BACKEND_MDSPLUS=ON -DAL_BUILD_MDSPLUS_MODELS=ON \
            -DAL_BACKEND_HDF5=ON -DAL_BACKEND_UDA=OFF \
            -DAL_TESTS=ON -DAL_EXAMPLES=ON -DAL_PLUGINS=OFF \
            -DAL_HLI_DOCS=OFF
          actual=$(git -C hli-java/build/_deps/al-core-src rev-parse HEAD)
          test "$actual" = "${{ steps.pins.outputs.core }}"

      - name: Build Java, Core and MDSplus models
        id: build_java
        run: cmake --build hli-java/build --parallel 2

      # IMAS-Java has no tests/ subdirectory in its CMake graph -- the root
      # CMakeLists.txt adds only examples/ -- so the whole suite is the 25
      # example programs. Unlike MATLAB, the Java fork registers no linkage
      # test of its own, so readelf is checked here the way cpp-hli does it.
      - name: Verify the Java test suite and linkage
        working-directory: hli-java/build
        run: |
          set -euo pipefail
          ctest --show-only=json-v1 > test-inventory.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          tests = json.loads(Path('test-inventory.json').read_text())['tests']
          # 32ea1eb registers the 25 example programs listed in
          # examples/CMakeLists.txt. AL_PLUGINS=OFF, so no -with-plugins twin.
          # The four beyond 879c7b2's 21 are that fork's shim-tolerance tests,
          # added by 30ea5f1; two of them are gated on a persistent backend,
          # and MDSplus is on. The pin has moved past 30ea5f1 only to correct
          # two of those tests' bodies, so the count it registers is still
          # 30ea5f1's.
          assert len(tests) == 25, f'Expected 25 Java tests, got {len(tests)}'
          names = {t['name'] for t in tests}
          for required in ('example-java-TestCoreProfilesPut',
                           'example-java-TestCoreProfilesGet',
                           'example-java-TestVersion',
                           'example-java-TestALExceptionCarriedStatus',
                           'example-java-TestLeafReadTolerance',
                           'example-java-TestOperationRecordLifecycle',
                           'example-java-TestToleranceChokepoint'):
              assert required in names, (required, sorted(names))
          disabled = [t['name'] for t in tests for p in t['properties']
                      if p['name'] == 'DISABLED' and p['value']]
          assert not disabled, disabled
          for test in tests:
              props = {p['name']: p['value'] for p in test['properties']}
              env = props.get('ENVIRONMENT', [])
              assert any(e.startswith('IMAS_CORE_LIBRARY=') for e in env), test['name']
              assert 'IMAS_MVDD_HLI_DD_VERSION=4.1.1' in env, test['name']
          print(f'{len(tests)} enabled Java tests, all configured for the shim')
          PYCODE
          readelf -d lib/libal-java-binding.so | tee java-linkage.txt
          grep -q 'Shared library: \[libimas_mvdd_loader' java-linkage.txt
          if grep -q 'Shared library: \[libal\.so' java-linkage.txt; then
            echo 'The JNI binding links directly to Core and would bypass the shim' >&2
            exit 1
          fi
          for file in ids_model.tree ids_model.characteristics; do
            test -s "_deps/al-core-build/models/mdsplus/$file"
          done
          test -e _deps/al-core-build/models/mdsplus/ids_model.datafile

      # The examples share pulses, so keep CTest serial. Core interpolates USER
      # into legacy pulse paths; keep all test data inside this build.
      - name: Run the Java HLI tests
        working-directory: hli-java/build
        run: |
          set -euo pipefail
          mkdir -p "$PWD/testdb"
          export USER="$PWD/testdb"
          ctest --output-on-failure --no-tests=error --parallel 1

      - name: Preserve Java test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-hli-diagnostics
          path: |
            mdsplus-packages.txt
            hli-java/build/Testing/Temporary/
            hli-java/build/test-inventory.json
            hli-java/build/java-linkage.txt
